<!--
Canopy remix final8 (Nov 16): Contact button removed from the candidate card (three links fit). final7 (Nov 16): Résumé and LinkedIn links in the candidate card (sample file and link). final6 (Nov 16): 'Also probed by' with first names in the loop's avatar style (loop labels carry the same names); Start interview on the title row; a stronger Job description button; Contact with email and phone (sample). final5: final4 + Back to prep during the interview (notes and scores kept); the 1–4 score sits as chips beside each criterion name, so under the questions there's only the note.
final4: v22 (Ruolan 8/10, signs off) + her polish: one avatar style (grey disc; the loop adds the done-check); 12 MW inline at body size; one meta line; How-to in the button shape; a quieter hover underline; a status ring before Recommendation. Kept: Jordan at 28 (the person asked for the name highlighted), single-letter avatars (two letters put 'NO' beside the No recommendation).
v22: v21 + Ruolan (7/10): rubric tooltip no longer clipped (the card doesn't hide overflow); a visible hover cue on the names (control-grey underline, name + tile as target); four type tiers (40/24/16/13); one profile meta line; the application's own words for 12 MW; PE in ink; 'How-to' named once; one footer divider; one drawer label column; focus avatars without the done-check.
v21: v20 + Ruolan (8/10): the focus area is the one raised surface and its names step up to 24; rubric tips open to the right; two deliberate profile meta lines; a one-line 12 MW fact; Owen's node needs no label; one 'done' language (no extra ring); the other-criteria row leads with grey criterion tiles; one drawer label style.
v20: v19 + Ruolan (8/10): no instruction box (the quote opens only on hover/select); one-surface candidate card (plain meta line, two facts without boxes, 12 MW the one figure, in Jordan's words); one avatar style with the done-check; one-word loop labels on one line; no 15px; a real 'other criteria' row; Submit deep green when ready, grey when not.
v19: show, don't tell. Rubric definitions, interview asks, Jordan's details and the blind rule move into hover; the loop is a horizontal 1-5 avatar strip (Ruolan v18) whose step shows what it asked on hover/tap; candidate and loop are two cards; Jordan's name larger; Start interview deep green, level with the top row.
final3: v18 (Ruolan look judge 8/10, signs off) + her polish: the frame ends with its content; the other criteria named without the count; one control text size; PE badge at 13; a quiet guide fill; 12 MW as the one figure; a briefcase for the project; a ring that fills when a recommendation is chosen.
v18: v17 + Ruolan's look critique (8/10): a lighter right column (first-name bylines, no step numbers; two facts, PE as a badge by the name; a two-line profile meta); Owen's node ringed with the lock beside it; plain 'also covered' avatars; even header separators; quiet '3 more criteria' with names; 16px score values; an outlined disabled Submit.
v17: v16 + Ruolan's look critique (8/10): the focus area is one grid (headers, questions, scores in shared rows), so both score blocks align; journey quotes quieter (ink2) and tighter; one check style (green = asked / done); the You step is Owen's avatar with his two criteria; '14 of 60 min'; a clearly unavailable Submit; no 'Your focus' label; 'Search'; a one-line profile meta.
v16: v15 + Ruolan's look critique (8/10): profile in two lines + meta; criterion done = its icon tile turns into a green check (one check style); no '5 left'; timer '14 min'; journey steps numbered, lock on the timeline; 'also covered' words dropped (names on hover); badge glyph for the license; one border grey for non-inputs; drawer values in ink; How-to as a white closable block.
v15: v14 + Ruolan's look critique (7/10): journey quote first (16 regular), then who (13); a present profile (22px name, one role line, 12 MW and PE as figures, no divider); 'also covered' sits under each definition, columns end where they end; full-width 1–4; marks instead of 'still to do'; the You step shows Owen's two criteria as icons; one control label size; 'Cooperative'.
v14: v13 + Ruolan's look critique (7/10): Jordan named once up top (the profile); journey steps two lines (title · who, then the quote); one avatar style with a check; no hanging divider; score blocks aligned, no repeated 'Your score'; 'How-to'; a lock with 'Scores hidden'; one less tier.
v13: look pass against Elisha v4 and Ruolan v18 (Ruolan look judge 7/10 on final2): status as marks (avatar + check), a stronger profile, small avatar rows for 'also covered by', no labels that restate the form, '5 of 5' in the title, airier definitions, a cleaner Application drawer.
final2: v12 (Ruolan 8/10, signs off) + her polish: Recommendation uses the same segmented control as the score; one border grey for secondary buttons; even label gaps; sentence-case drawer heads; a muted disabled Submit; 'also covered by' rows aligned across both columns.
v12: v11 + Ruolan's v11 critique (8/10): Application opens the full record as submitted (no invented résumé); the profile is an open block, the focus area the only bordered one; 'also covered by' label above its pills; one sentence-case label style; disabled Submit outlined, to-do only while something's missing; input edges at 3:1; the 3 other criteria named.
v11: v10 + Ruolan's v10 critique (7/10): journey quotes wrap to two lines so repeats stay visible; no invented quote marks on Jordan's cover note; plain facts; one JD link (by the role); white profile card, fill only on the team's questions; 8/16/24 spacing; no 'not scored yet'; one label style.
v10: v9 + Ruolan's v9 critique (7/10): each focus column ends where its content ends; 'also covered by' pills carry the journey's step numbers; Submit needs scores, notes and a recommendation, and says so; four type tiers (40/22/16/13); a quieter profile card; journey quotes one line each, full on hover; 'Interview 5 of 5' once; the guide labelled as Canopy's.
v9: restructured to the person's golden workflow (open 5 min before; know the candidate, the role,
what to ask and what was asked, how to evaluate, how to fill the scorecard, where this interview fits; click for more).
- One focus container, two columns; the team's questions sit inside the focus area they test (the team's tag, assumed).
- During the call each focus column becomes its part of the scorecard, under its questions (fields unchanged, moved).
- Profile card restored: photo, name, role, place; three facts; Application / Job description / Contact one click each.
- Journey on the right: 1-5, what each asked (quoted, from the plan), then who; scores closed until submit.
- Less text: no section sub-captions, short facts, one line per journey step's byline.
-->

<style>

function act(i,a,k){const s=S[i];
 switch(a){

 }
 render(i)}
