<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Design Evaluation Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sign-in gate first; then a sticky bar (product, who is signed in), a dark band for the original, one card per blind option, scorecard */
:root{
  --bg:#F2F3F1;--surface:#FFFFFF;--sunk:#E7E9E5;--ink:#16181A;--ink2:#4C5157;--muted:#7A8087;--line:#DADDD8;
  --accent:#2F5D50;--accentInk:#FFFFFF;--warn:#8A5A12;--navy:#1E2A5A;--navyInk:#FFFFFF;--navyTint:#E4E8F3;--stage:#EBECE8;
  --origBg:#1B1F23;--origInk:#F2F3F1;--origMuted:#A9B0B6;--origTag:#E8C26A;--origTagInk:#1B1F23;
  --j1:#2F5D50;--j2:#7A4FA3;--j3:#B4562E;--j4:#2E6FA8;--j5:#8C7020;--j6:#9C3F66;
  --display:"Space Grotesk",Inter,system-ui,sans-serif;--body:Inter,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--surface:#1B1E21;--sunk:#24282C;--ink:#ECEEEF;--ink2:#B8BEC4;--muted:#8B9299;--line:#30353A;--accent:#7FB8A6;--accentInk:#0E1A16;--warn:#E0B36A;--navy:#3A4E8C;--navyInk:#FFFFFF;--navyTint:#232B42;--stage:#0E1012;--origBg:#2A2416;--origInk:#F4EEDF;--origMuted:#C9BFA6;--origTag:#E8C26A;--origTagInk:#1B1F23;--j1:#7FB8A6;--j2:#B79BD8;--j3:#E39A72;--j4:#8BB8E3;--j5:#D9BC6A;--j6:#DE8CB0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121416;--surface:#1B1E21;--sunk:#24282C;--ink:#ECEEEF;--ink2:#B8BEC4;--muted:#8B9299;--line:#30353A;--accent:#7FB8A6;--accentInk:#0E1A16;--warn:#E0B36A;--navy:#3A4E8C;--navyInk:#FFFFFF;--navyTint:#232B42;--stage:#0E1012;--origBg:#2A2416;--origInk:#F4EEDF;--origMuted:#C9BFA6;--origTag:#E8C26A;--origTagInk:#1B1F23;--j1:#7FB8A6;--j2:#B79BD8;--j3:#E39A72;--j4:#8BB8E3;--j5:#D9BC6A;--j6:#DE8CB0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
img{max-width:100%}
.wrap{margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
html{scroll-snap-type:y proximity}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px 16px;padding-block:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg a{padding:6px 14px;border-radius:999px;color:var(--ink2);text-decoration:none;font-weight:600}
.seg [aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seat{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.me i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.unlock{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.unlock .in{width:180px;padding:5px 12px;border-radius:999px;font-size:13px}
.role{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);color:var(--ink2);border-radius:6px;padding:3px 8px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--ink2)}
.tb:hover{border-color:var(--accent);color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--navy);color:var(--navyInk);border-color:var(--navy)}
main .wrap{padding-block:16px 64px;display:flex;flex-direction:column;gap:16px}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* sign-in gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:28px}
.card .ch{display:flex;flex-direction:column;gap:8px}
.card h2{font-family:var(--display);font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em}
.card p{margin:0;color:var(--ink2)}
.card form{display:flex;flex-direction:column;gap:16px}
.card .field{display:flex;flex-direction:column;gap:6px}
.card form .btn{margin-top:8px}
.card label{font-size:13px;font-weight:600;color:var(--ink2)}
.msg:empty{display:none}
.in{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);width:100%}
.btn{background:var(--accent);color:var(--accentInk);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.navy{background:var(--navy);color:var(--navyInk);border-color:var(--navy)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:progress}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.msg{font-size:13px;color:var(--warn);margin:0}
.msg.ok{color:var(--accent)}
code{font-size:12.5px;background:var(--sunk);border-radius:4px;padding:1px 5px}
/* original: its own dark band so it never reads as an option */
.orig{background:var(--origBg);color:var(--origInk);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;scroll-snap-align:start;scroll-margin-top:calc(var(--hh,60px) + 16px)}
.orig .oh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.orig .tag{background:var(--origTag);color:var(--origTagInk);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:4px 9px}
.orig h2{font-family:var(--display);font-size:22px;margin:0;font-weight:700}
.orig .sub{color:var(--origMuted);font-size:13px;margin-left:auto}
.orig figure{margin:0;display:flex;justify-content:center}
.orig img{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100dvh - var(--hh,60px) - 120px);border-radius:10px;background:#fff;cursor:zoom-in}
.opts-h{display:flex;align-items:baseline;gap:10px;scroll-margin-top:72px}
.opts-h h2{font-family:var(--display);font-size:22px;margin:0}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:clip;display:flex;flex-direction:column;height:calc(100dvh - var(--hh,60px) - 32px);min-height:560px;scroll-snap-align:start;scroll-margin-top:calc(var(--hh,60px) + 16px)}
.ohead{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.letter{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tools{margin-left:auto;display:flex;gap:6px}
/* --rw / --ww: rate and rationale widths, set by dragging their left edges; clamped so the design keeps room */
:root{--rwc:clamp(280px,var(--rw,352px),40%);--wwc:clamp(260px,var(--ww,34%),45%)}
.obody{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--rwc)}
/* rationale: optional reading column between the design and the rating panel */
.obody.wy{grid-template-columns:minmax(0,1fr) var(--wwc) var(--rwc)}
/* .nr: scoring rubric hidden for this option */
.obody.nr{grid-template-columns:minmax(0,1fr)}
.obody.wy.nr{grid-template-columns:minmax(0,1fr) var(--wwc)}
.obody.nr .rcol,.obody.nr .rs[data-rs="rate"]{display:none}
.obody.nr .rs[data-rs="why"]{right:var(--wwc)}
.rs{position:absolute;top:0;bottom:0;z-index:3;width:12px;margin-right:-6px;cursor:col-resize;touch-action:none;outline:none}
.rs[data-rs="rate"]{right:var(--rwc)}
.rs[data-rs="why"]{right:calc(var(--rwc) + var(--wwc));display:none}
.obody.wy .rs[data-rs="why"]{display:block}
.rs::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:transparent;transition:background-color .15s}
.rs:hover::after,.rs:focus-visible::after,.rs.on::after{background:var(--accent)}
.rs::before{content:"";position:absolute;left:3px;top:50%;width:6px;height:32px;margin-top:-16px;border-radius:3px;background:var(--line);opacity:0;transition:opacity .15s}
.rs:hover::before,.rs:focus-visible::before,.rs.on::before{opacity:1;background:var(--accent)}
body.rsz{cursor:col-resize;user-select:none}body.rsz iframe{pointer-events:none}
.why{display:none;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-left:1px solid var(--line);background:var(--surface)}
.obody.wy .why{display:block}
.wh{position:sticky;top:0;z-index:1;padding:14px 24px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.wb{padding:4px 24px 28px;font-size:13.5px;line-height:1.55;color:var(--ink2);overflow-wrap:anywhere}
.wb h2,.wb h3,.wb h4{color:var(--ink);line-height:1.3;margin:22px 0 8px}
.wb h2{font-family:var(--display);font-size:19px}.wb h3{font-size:15px}.wb h4{font-size:14px}
.wb p{margin:0 0 10px}.wb ul,.wb ol{margin:0 0 12px;padding-left:20px}.wb li{margin:3px 0}
.wb li.task{list-style:none;margin-left:-20px}.wb li.task input{margin:0 6px 0 0;vertical-align:-2px}
.wb strong{color:var(--ink);font-weight:600}.wb a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:2px}
.wb .tw{overflow-x:auto;margin:4px 0 14px;border:1px solid var(--line);border-radius:8px}
.wb table{border-collapse:collapse;font-size:12px;line-height:1.45;min-width:100%}
.wb th,.wb td{text-align:left;vertical-align:top;white-space:normal;min-width:110px;padding:6px 9px;border-bottom:1px solid var(--line)}
.wb th{background:var(--bg);color:var(--ink);font-weight:600}.wb tr:last-child td{border-bottom:0}
.wb .none{color:var(--muted);margin-top:16px}
/* stage: designs scaled as large as the space allows, centered; tall ones scroll inside */
.live{min-width:0;min-height:0;overflow:auto;overscroll-behavior-y:auto;display:flex;flex-direction:column;gap:24px;padding:24px;background:var(--stage)}
.vp{flex:none;margin:auto;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.06),0 12px 32px -8px rgba(16,24,40,.12)}
.sizer{position:relative;width:100%;height:600px;overflow:hidden}
.sizer iframe{position:absolute;left:0;top:0;width:1440px;height:600px;border:0;transform-origin:0 0;background:#fff}
/* rating panel */
.rcol{min-width:0;min-height:0;overflow-y:auto;border-left:1px solid var(--line);display:flex;flex-direction:column}
.rcol .rate{flex:1}
.rate{padding:18px 24px 12px}
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:6px}
.rt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.saved{font-size:12px;color:var(--muted);transition:opacity .3s}
.saved:empty{opacity:0}
.crit{padding:14px 0 16px;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ct h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.005em;color:var(--ink)}
.cv{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--navy)}
.cv small{font-size:inherit;font-weight:500;color:var(--muted)}
.cv:empty::before{content:"–";color:var(--muted);font-weight:500}
.cd{margin:3px 0 10px;font-size:13px;line-height:1.45;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.scale button{-webkit-appearance:none;appearance:none;margin:0;border-radius:0;height:34px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink2);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:background-color .15s,color .15s}
.scale button:first-child{border-left:0}
.scale button:not(:disabled):not([aria-pressed="true"]):hover{background:var(--bg);color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--navy);color:var(--navyInk)}
.scale button:focus{outline:none}
.scale button:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.scale button[aria-pressed="true"]:focus-visible{outline-color:var(--navyInk)}
.scale button:disabled{cursor:default}
.cnote{display:block;width:100%;min-height:34px;max-height:calc(5.8em + 16px);margin-top:10px;resize:none;overflow:hidden;overscroll-behavior:contain;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 10px;font:inherit;font-size:13px;line-height:1.45;color:var(--ink)}
.cnote::placeholder{color:var(--muted)}
.cnote:not(:disabled):hover{border-color:var(--muted)}
.cnote:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navyTint)}
/* one Done for the whole panel; pinned to the bottom of the panel column */
.rfoot{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:14px 24px 18px;background:var(--surface);border-top:1px solid var(--line)}
.rfoot .hint{font-size:12px;color:var(--muted)}
.odone{-webkit-appearance:none;appearance:none;margin-left:auto;height:36px;min-width:96px;padding:0 18px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:var(--navyInk);font-size:14px;font-weight:600;transition:background-color .15s,border-color .15s,color .15s}
.odone:disabled{background:transparent;border-color:var(--line);color:var(--muted);cursor:not-allowed}
.rfoot.done .odone{background:var(--surface);border-color:var(--line);color:var(--ink2)}
.rfoot.done .odone:hover{border-color:var(--navy);color:var(--navy)}
/* done: the whole panel greys out until Edit */
.crit h3,.cv{transition:color .2s}
.scale,.cnote{transition:opacity .2s,filter .2s,border-color .15s,box-shadow .15s}
.rate.done h3,.rate.done .cv,.rate.done .cv small{color:var(--muted)}
.rate.done .scale,.rate.done .cnote{filter:grayscale(1);opacity:.5}
.rate.done .cnote{background:var(--bg)}
/* organizer judge filter: dropdown next to "View all judges" */
.dd{position:relative}
.ddbtn{display:inline-flex;align-items:center;gap:6px}
.ddbtn svg{width:12px;height:12px;transition:transform .15s}
.ddbtn[aria-expanded="true"]{border-color:var(--navy);color:var(--ink)}
.ddbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:280px;max-width:calc(100vw - 32px);max-height:min(60vh,440px);overflow:auto;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 6px rgba(16,24,40,.06),0 16px 40px -12px rgba(16,24,40,.22)}
.ddh{padding:8px 10px 6px}
.jck{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none}
.jck:hover{background:var(--bg)}
.jck i{width:8px;height:8px;border-radius:50%;flex:none}
.jck span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jck.off{color:var(--muted)}
.jck.off i{opacity:.4}
.ck{-webkit-appearance:none;appearance:none;flex:none;width:16px;height:16px;margin:0;border:1.5px solid var(--muted);border-radius:4px;background:var(--surface);display:grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
.ck:checked{background:var(--navy);border-color:var(--navy)}
.ck:checked::after{content:"";width:8px;height:4px;margin-top:-2px;border:2px solid var(--navyInk);border-top:0;border-right:0;transform:rotate(-45deg)}
.ck:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ddf{display:flex;justify-content:space-between;gap:8px;margin-top:4px;padding:6px 2px 2px;border-top:1px solid var(--line)}
.lnk{-webkit-appearance:none;appearance:none;border:0;background:none;padding:4px 8px;border-radius:6px;color:var(--navy);font-size:13px;font-weight:600}
.lnk:hover{background:var(--navyTint)}
.lnk:disabled{color:var(--muted);background:none;cursor:default}
.ddempty{padding:10px;font-size:13px;color:var(--muted)}
/* organizer panel */
.jpick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 6px}
.jp{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink2);font-size:13px;font-weight:600}
.jp i{width:8px;height:8px;border-radius:50%}
.jp:hover{border-color:var(--muted);color:var(--ink)}
.jp[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navyInk)}
.scale span{display:flex;align-items:center;justify-content:center;height:34px;border-left:1px solid var(--line);color:var(--ink2);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.scale span:first-child{border-left:0}
.scale span.on{background:var(--navy);color:var(--navyInk)}
.scale.avg span.on{background:var(--navyTint);color:var(--navy)}
.rnote{margin:10px 0 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;line-height:1.45;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.rnote.none{color:var(--muted)}
.empty{margin:16px 0;color:var(--muted);font-size:13px}
/* admin: every judge's scores under each option */
.jlist{border-top:1px solid var(--line);padding:12px 16px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.jrow{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;font-size:13px}
.jrow i{width:8px;height:8px;border-radius:50%;display:inline-block}
.jrow b{font-weight:600;min-width:110px}
.jrow .sc{color:var(--ink2);font-variant-numeric:tabular-nums}
.jrow .nt{color:var(--muted);flex-basis:100%;padding-left:20px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:72px}
.board .bh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.board h2{font-family:var(--display);font-size:20px;margin:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.wrapnote{white-space:normal;min-width:240px;color:var(--ink2)}
.nl{display:block;line-height:1.45}
.nl+.nl{margin-top:4px}
.nl b{font-weight:600;color:var(--ink);margin-right:6px}
th{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
th.jh{color:var(--ink2);text-transform:none;letter-spacing:0;font-size:13px}
th.jh i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
td.l a{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);text-decoration:none}
.bar{display:flex;align-items:center;gap:8px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--navy);min-width:2px}
.bar b{font-weight:600}
.js{font-size:13px;color:var(--ink2)}
.js b{font-weight:600;color:var(--ink)}
.dim{color:var(--muted)}
.sep{border-left:2px solid var(--line)}
.status{font-size:13px;color:var(--warn)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,12,14,.88);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) max(56px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 48px) max(56px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}

/* Each judge sees the options in their own shuffled order, fixed by their email and the product,
   so it's random across judges but the same every time one judge comes back, on any device.
   A–E are shuffled as they always were; options added later (F, …) are slotted in at a position
   seeded the same way, so adding one never reorders what a judge has already seen.
   Don't change this function once judging starts: it would reshuffle everyone. */
const BASE_OPTIONS=5;
function seeded(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  let t=h>>>0;return()=>{t=(t+0x6D2B79F5)>>>0;let r=Math.imul(t^(t>>>15),1|t);r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296}}
function orderedOptions(product){
  const all=DATA[product].options;if(!me||!me.email)return all.filter(o=>!o.hidden);
  const key=me.email.toLowerCase()+"|"+product,opts=all.slice(0,BASE_OPTIONS),rnd=seeded(key);
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
  for(const o of all.slice(BASE_OPTIONS))opts.splice(Math.floor(seeded(key+"|"+o.id)()*(opts.length+1)),0,o);
  return opts.filter(o=>!o.hidden);
}

  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||`Request failed (${r.status})`),{status:r.status});

/* ---------- rendering ---------- */
function renderSeat(){
  $("#seat").innerHTML=`<span class="lab">Scoring as</span><span class="me"><i></i><span title="${esc(me.email)}">${esc(who(me))}</span></span>`
    +(me.canAdmin?(unlocking
      ?`<form class="unlock" id="unlock"><input class="in" id="passcode" type="password" placeholder="Organizer passcode" aria-label="Organizer passcode" autocomplete="current-password"><button class="tb" type="submit">Unlock</button><button class="tb" type="button" data-act="cancel">Cancel</button><span class="msg" id="unlock-msg" role="status"></span></form>`

    +`<button class="tb" data-act="out">Sign out</button>`;
}
function render(){

  renderSeat();renderFilter();
  const P=DATA[prod],my=mine[prod]||{};
  let h=`<section class="orig" id="orig"><div class="oh"><span class="tag">Original</span><h2>${NAMES[prod]} today</h2><span class="sub">The screen being redesigned</span></div>${P.original.map(o=>`<figure><img src="${o.src}" width="${o.wh[0]}" height="${o.wh[1]}" alt="Original ${NAMES[prod]} screens" data-lb="${o.src}"></figure>`).join("")}</section>`;
  if(viewAll)h+=allBoard();
  h+=`<div class="opts-h" id="opts"><h2>Redesigns</h2><span class="lab">${shown(prod).length} options, blind</span></div>`;

    ${CRIT.map(([c,,lab,desc])=>{const has=typeof s[c]==="number";return `<div class="crit" data-c="${c}"><div class="ct"><h3 id="cl-${o.id}-${c}">${lab}</h3><span class="cv">${cv(s[c])}</span></div><p class="cd">${desc}</p><div class="scale" role="group" aria-labelledby="cl-${o.id}-${c}">${[1,2,3,4,5].map(n=>`<button data-c="${c}" data-n="${n}" aria-pressed="${s[c]===n}" aria-label="${n} out of 5"${d?" disabled":""}>${n}</button>`).join("")}</div><textarea class="cnote" rows="1" data-c="${c}" maxlength="500" placeholder="Note (optional)" aria-label="${lab} note for option ${o.label}"${d?" disabled":""}>${esc(nt[c]||"")}</textarea></div>`}).join("")}

/* minimal Markdown: headings, paragraphs, lists, task lists, tables, bold, italic, links */
function md(src){
  const inl=t=>esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g,"$1<em>$2</em>");
  const cells=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  const L=src.replace(/\r/g,"").split("\n"),out=[];let i=0;
  while(i<L.length){const l=L[i];
    if(!l.trim()){i++;continue}
    let m=l.match(/^(#{1,3})\s+(.*)/);if(m){const n=m[1].length+1;out.push(`<h${n}>${inl(m[2])}</h${n}>`);i++;continue}
    if(/^\s*\|/.test(l)&&/^\s*\|?\s*:?-{3,}/.test(L[i+1]||"")){const head=cells(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(cells(L[i++]));
      out.push(`<div class="tw"><table><thead><tr>${head.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l),items=[];
      while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i])){let t=L[i++].replace(/^\s*([-*]|\d+\.)\s+/,"");const tk=t.match(/^\[( |x)\]\s+(.*)/i);
        items.push(tk?`<li class="task"><input type="checkbox" disabled${tk[1].trim()?" checked":""} aria-label="${tk[1].trim()?"Done":"Not done"}">${inl(tk[2])}</li>`:`<li>${inl(t)}</li>`)}
      out.push(`<${ol?"ol":"ul"}>${items.join("")}</${ol?"ol":"ul"}>`);continue}
    const para=[];while(i<L.length&&L[i].trim()&&!/^(#{1,3}\s|\s*\||\s*([-*]|\d+\.)\s+)/.test(L[i]))para.push(L[i++].trim());
    out.push(`<p>${para.map(inl).join("<br>")}</p>`)}
  return out.join("")}
function whyBody(id){const k=prod+":"+id,u=(WHY[prod]||{})[id];
  if(!u)return `<p class="none">No rationale has been added for this option yet.</p>`;
  if(whyCache[u])return whyCache[u];
  fetch(u).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{whyCache[u]=md(t)}).catch(()=>{whyCache[u]=`<p class="none">The rationale didn’t load. Reload the page to try again.</p>`})
    .then(()=>{const el=document.querySelector(`#opt-${id} .wb`);if(el&&k===prod+":"+id)el.innerHTML=whyCache[u]});
  return `<p class="none">Loading…</p>`}
/* drag (or arrow keys on) a panel's left edge to resize it; double-click resets. One size for every option, remembered per browser. */
const RS={rate:{v:"--rw",sel:".rcol",min:280},why:{v:"--ww",sel:".why",min:260}};
const rootStyle=document.documentElement.style;
try{const z=JSON.parse(localStorage.getItem("djb:panels")||"{}");for(const k in RS)if(z[k])rootStyle.setProperty(RS[k].v,z[k]+"px")}catch{}
function savePanels(){try{const z={};for(const k in RS){const v=parseFloat(rootStyle.getPropertyValue(RS[k].v));if(v)z[k]=v}localStorage.setItem("djb:panels",JSON.stringify(z))}catch{}}
function setPanel(h,w){const k=h.dataset.rs,body=h.parentElement,other=k==="rate"?body.querySelector(".why"):body.querySelector(".rcol");
  const otherW=other&&other.offsetParent?other.getBoundingClientRect().width:0,max=body.clientWidth-otherW-320;

function refitAll(){document.querySelectorAll(".sizer iframe").forEach(fit)}
let rsRaf=0;const refitSoon=body=>{if(rsRaf)return;rsRaf=requestAnimationFrame(()=>{rsRaf=0;body.querySelectorAll(".sizer iframe").forEach(fit)})};
document.addEventListener("pointerdown",e=>{const h=e.target.closest(".rs");if(!h||e.button!==0)return;e.preventDefault();
  const body=h.parentElement,w0=body.querySelector(RS[h.dataset.rs].sel).getBoundingClientRect().width,x0=e.clientX;

  h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up)});

  else{const w=h.parentElement.querySelector(RS[h.dataset.rs].sel).getBoundingClientRect().width;setPanel(h,w+(e.key==="ArrowLeft"?24:-24))}

function refreshMyBoard(){const b=$("#board");if(b)b.outerHTML=myBoard()}

/* organizer view: every judge, averages, notes */
const excluded=new Set();                       // judges unchecked in the organizer filter
function prodRows(){return adm.scores.filter(s=>s.product===prod&&isShown(s.product,s.option)&&!excluded.has(s.email))}
/* everyone who has rated anything, in sign-up order */
function raters(){const has=new Set(adm.scores.filter(r=>CRIT.some(([c])=>typeof r[c]==="number")).map(r=>r.email));return adm.judges.map((j,i)=>({...j,i})).filter(j=>has.has(j.email))}
let ddOpen=false;
const CHEV='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function renderFilter(){
  const d=$("#jdd");if(!d){ddOpen=false;return}
  const R=raters(),on=R.filter(j=>!excluded.has(j.email)).length;
  const label=!R.length?"Judges":on===R.length?`All judges (${R.length})`:`${on} of ${R.length} judges`;
  d.innerHTML=`<button class="tb ddbtn" data-dd aria-haspopup="true" aria-expanded="${ddOpen}" aria-controls="jddmenu">${label}${CHEV}</button>`
    +(ddOpen?`<div class="ddmenu" id="jddmenu" role="group" aria-label="Judges to include"><div class="ddh lab">Showing ratings from</div>${R.length
      ?R.map(j=>`<label class="jck${excluded.has(j.email)?" off":""}" title="${esc(j.email)}"><input class="ck" type="checkbox" data-jf="${esc(j.email)}"${excluded.has(j.email)?"":" checked"}><i style="background:${jcol(j.i)}"></i><span>${esc(who(j))}</span></label>`).join("")
        +`<div class="ddf"><button class="lnk" data-jfall="1"${on===R.length?" disabled":""}>Select all</button><button class="lnk" data-jfall="0"${on===0?" disabled":""}>Clear</button></div>`
      :`<p class="ddempty">No ratings yet.</p>`}</div>`:"");
}
function applyFilter(){
  renderFilter();
  const b=$("#allboard");if(b)b.outerHTML=allBoard();
  shown(prod).forEach(o=>{const el=document.getElementById("ap-"+o.id);if(el)el.innerHTML=adminPanel(o.id)});
}
function allBoard(){
  const P=DATA[prod],rows=prodRows(),scored=new Set(rows.map(r=>r.email)).size,sel=raters().filter(j=>!excluded.has(j.email)).length;
  const list=shown(prod).map(o=>{
    const rs=rows.filter(r=>r.option===o.id),avg={};
    CRIT.forEach(([c])=>{const v=rs.map(r=>r[c]).filter(x=>typeof x==="number");avg[c]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
    return {o,avg,n:new Set(rs.filter(r=>CRIT.some(([c])=>typeof r[c]==="number")).map(r=>r.email)).size};
  }).sort((a,b)=>mean(b.avg)-mean(a.avg)||a.o.label.localeCompare(b.o.label));
  const cell=v=>v==null?`<td class="dim">–</td>`:`<td><div class="bar"><i style="width:${(v/5*56).toFixed(0)}px"></i><b>${v.toFixed(1)}</b></div></td>`;
  return `<section class="board" id="allboard"><div class="bh"><h2>All judges</h2><span class="lab">${scored} of ${sel} selected judge${sel===1?"":"s"} scored ${NAMES[prod]}</span></div>${scored?`<div class="tbl"><table><thead><tr><th>Option</th>${CRIT.map(([,l])=>`<th>${l} avg</th>`).join("")}<th>Judges</th></tr></thead><tbody>
  ${list.map(r=>`<tr><td class="l"><a href="#" data-goto="${r.o.id}">${r.o.label}</a></td>${CRIT.map(([c])=>cell(r.avg[c])).join("")}<td>${r.n||'<span class="dim">–</span>'}</td></tr>`).join("")}
  </tbody></table></div><div class="lab" style="text-transform:none;letter-spacing:0">Sorted by average across all questions. Pick a judge in an option’s side panel to see their ratings and notes. Updates every 20 seconds.</div>`:`<p class="dim" style="margin:0">${sel?`No scores for ${NAMES[prod]} from the selected judges.`:"No judges selected. Tick at least one name above."}</p>`}<div class="status"></div></section>`;
}
/* organizer panel: pick a judge (or the average) and see their ratings for this option, read-only */
const pick={};                                  // "<product>:<option>" → judge email or "avg"
const when=t=>{try{return new Date(t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}catch{return ""}};
function adminPanel(oid){
  const rows=prodRows().filter(r=>r.option===oid&&CRIT.some(([c])=>typeof r[c]==="number"||(notesOf(r)[c]||"")));
  const idx=Object.fromEntries(adm.judges.map((j,i)=>[j.email,i])),by=Object.fromEntries(adm.judges.map(j=>[j.email,j]));
  rows.sort((a,b)=>(idx[a.email]??0)-(idx[b.email]??0));
  const head=`<div class="rh"><span class="rt">Ratings for option ${L(oid)}</span><span class="saved">${rows.length} judge${rows.length===1?"":"s"}</span></div>`;
  if(!rows.length)return `<aside class="rate">${head}<p class="empty">${excluded.size?`None of the selected judges has rated option ${L(oid)}.`:`No one has rated option ${L(oid)} yet.`}</p></aside>`;
  const k=prod+":"+oid;if(!pick[k]||(pick[k]!=="avg"&&!rows.some(r=>r.email===pick[k])))pick[k]=rows.length>1?"avg":rows[0].email;
  const sel=pick[k],r=sel==="avg"?null:rows.find(x=>x.email===sel);
  const chips=(rows.length>1?`<button class="jp" data-pick="avg" data-o="${oid}" aria-pressed="${sel==="avg"}">Average</button>`:"")
    +rows.map(x=>`<button class="jp" data-pick="${esc(x.email)}" data-o="${oid}" aria-pressed="${sel===x.email}" title="${esc(x.email)}"><i style="background:${jcol(idx[x.email]??0)}"></i>${esc(by[x.email]?who(by[x.email]):x.email)}</button>`).join("");
  const crit=CRIT.map(([c,,lab,desc])=>{
    let v,shown,note="";
    if(r){v=r[c];shown=typeof v==="number"?v:null;note=notesOf(r)[c]||""}
    else{const vs=rows.map(x=>x[c]).filter(x=>typeof x==="number");v=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;shown=v==null?null:Math.round(v)}
    const read=v==null?"":`${r?v:v.toFixed(1)}<small>/5</small>`;
    return `<div class="crit"><div class="ct"><h3>${lab}</h3><span class="cv">${read}</span></div><p class="cd">${desc}</p><div class="scale ro${r?"":" avg"}" aria-hidden="true">${[1,2,3,4,5].map(n=>`<span class="${n===shown?"on":""}">${n}</span>`).join("")}</div>${r?`<p class="rnote${note?"":" none"}">${note?esc(note):"No note"}</p>`:""}</div>`}).join("");
  const foot=r?`${r.done?"Marked done":"In progress"} · last saved ${when(r.updated_at)}`:`Average of ${rows.length} judges`;
  return `<aside class="rate">${head}<div class="jpick" role="group" aria-label="Show ratings from">${chips}</div>${crit}</aside><div class="rfoot"><span class="hint">${foot}</span></div>`;
}
async function refreshAll(){
  try{await loadAll()}catch(err){setStatus(err.status===403?"Organizer access ended. Sign in again with the passcode.":"Couldn’t refresh scores. Retrying shortly.");return}
  if(!viewAll)return;
  applyFilter();
}
function exportCsv(){
  const by=Object.fromEntries(adm.judges.map(j=>[j.email,j]));
  const safe=v=>{v=v==null?"":String(v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[["judge","email","product","option","option_id",...CRIT.map(([c])=>c),...CRIT.map(([c])=>c+"_note"),"updated_at"],
    ...adm.scores.filter(s=>DATA[s.product]&&isShown(s.product,s.option)).map(s=>{const n=notesOf(s),o=DATA[s.product].options.find(x=>x.id===s.option);return [(by[s.email]||{}).name||"",s.email,s.product,o.label,s.option,...CRIT.map(([c])=>s[c]),...CRIT.map(([c])=>n[c]),s.updated_at]})].map(r=>r.map(safe).join(","));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));
  a.download=`judging-scores-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function setStatus(t){document.querySelectorAll(".status").forEach(s=>s.textContent=t||"")}

/* ---------- saving ---------- */
function queueSave(o,ms=400){
  const p=prod,k=p+":"+o,sv=document.getElementById("sv-"+o);if(sv)sv.textContent="Saving…";
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>save(p,o),ms);
}
function save(p,o){
  delete timers[p+":"+o];
  chain=chain.then(async()=>{
    const s=(mine[p]||{})[o]||{};let error=null;
    try{await api("/api/scores",{method:"PUT",body:{product:p,option:o,...Object.fromEntries(CRIT.map(([c])=>[c,s[c]??null])),notes:notesOf(s),done:s.done===true}})}catch(err){error=err}
    if(prod===p){const sv=document.getElementById("sv-"+o);if(sv&&!timers[p+":"+o])sv.textContent=error?"Not saved":"Saved"}
    if(error&&error.status===401)return showGate("Your session ended. Sign in again with the same email; your saved scores are still there.");
    setStatus(error?"Couldn’t save your last change. Check your connection, then change the score again.":"");
    if(!error&&viewAll)refreshAll();
  });
  return chain;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-dd]")){ddOpen=!ddOpen;renderFilter();if(ddOpen)$("#jddmenu .ck")?.focus();return}
  if(ddOpen&&!e.target.closest("#jdd")){ddOpen=false;renderFilter()}
  const act=e.target.closest("[data-act]");
  if(act){const a=act.dataset.act;if(a==="out")signOut();
    else if(a==="all"){if(me.admin)setViewAll(!viewAll);else{unlocking=true;renderSeat();$("#passcode").focus()}}
    else if(a==="cancel"){unlocking=false;renderSeat()}
    else if(a==="csv")exportCsv();else if(a==="refresh")refreshAll();return}
  const b=e.target.closest(".scale button");
  if(b&&me){const o=b.closest(".rate").dataset.o,c=b.dataset.c,n=+b.dataset.n;
    const p=mine[prod]||(mine[prod]={});const s=p[o]=Object.assign({},p[o]);
    s[c]=s[c]===n?null:n;
    b.parentElement.querySelectorAll("button").forEach(x=>{const k=+x.dataset.n;x.setAttribute("aria-pressed",String(k===s[c]))});
    b.closest(".crit").querySelector(".cv").innerHTML=cv(s[c]);
    const ft=b.closest(".opt").querySelector(".rfoot"),all=allRated(s);ft.querySelector(".odone").disabled=!all;ft.querySelector(".hint").textContent=footHint(false,all);
    refreshMyBoard();queueSave(o);return}
  const dk=e.target.closest("[data-odone]");
  if(dk&&me){const o=dk.dataset.odone,op=dk.closest(".opt"),rt=op.querySelector(".rate"),ft=op.querySelector(".rfoot"),p=mine[prod]||(mine[prod]={}),cur=p[o]||{};
    const on=cur.done!==true;p[o]=Object.assign({},cur,{done:on});
    rt.classList.toggle("done",on);ft.classList.toggle("done",on);rt.querySelectorAll(".scale button,.cnote").forEach(x=>x.disabled=on);
    dk.textContent=on?"Edit":"Done";ft.querySelector(".hint").textContent=footHint(on,allRated(p[o]));
    queueSave(o,0);return}
  const ja=e.target.closest("[data-jfall]");
  if(ja){if(ja.dataset.jfall==="1")excluded.clear();else raters().forEach(j=>excluded.add(j.email));applyFilter();return}
  const pk=e.target.closest("[data-pick]");
  if(pk){const o=pk.dataset.o;pick[prod+":"+o]=pk.dataset.pick;document.getElementById("ap-"+o).innerHTML=adminPanel(o);return}
  const lb=e.target.closest("[data-lb]");if(lb){$("#lbimg").src=lb.dataset.lb;$("#lb").hidden=false;$("#lbx").focus();return}
  const g=e.target.closest("[data-goto]");if(g){e.preventDefault();document.getElementById("opt-"+g.dataset.goto).scrollIntoView({behavior:"smooth"});return}
  const w=e.target.closest("[data-why]");if(w){toggleWhy(w.dataset.why);return}
  const rb=e.target.closest("[data-rubric]");if(rb){toggleRubric(rb.dataset.rubric);return}
  const r=e.target.closest("[data-reload]");if(r){document.querySelectorAll(`#opt-${r.dataset.reload} iframe`).forEach(fr=>{fr.src=fr.src});return}
  const f=e.target.closest("[data-full]");if(f){openFull(f.dataset.full,0)}
});
document.addEventListener("input",e=>{
  if(me&&e.target.classList.contains("cnote")){const t=e.target,o=t.closest(".rate").dataset.o,p=mine[prod]||(mine[prod]={}),cur=p[o]||{};grow(t);
    p[o]=Object.assign({},cur,{notes:Object.assign({},notesOf(cur),{[t.dataset.c]:t.value.slice(0,500)})});delete p[o].note;queueSave(o,900)}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="unlock")return;e.preventDefault();
  const f=e.target,msg=$("#unlock-msg");f.querySelectorAll("button,input").forEach(x=>x.disabled=true);
  try{await api("/api/unlock",{method:"POST",body:{passcode:$("#passcode").value}});me.admin=true;unlocking=false;await setViewAll(true)}
  catch(err){f.querySelectorAll("button,input").forEach(x=>x.disabled=false);msg.textContent=err.message;$("#passcode").select()}
});
document.addEventListener("change",e=>{if(me&&e.target.classList.contains("cnote"))refreshMyBoard();
  const jf=e.target.closest("[data-jf]");if(jf){if(jf.checked)excluded.delete(jf.dataset.jf);else excluded.add(jf.dataset.jf);applyFilter();$(`[data-jf="${CSS.escape(jf.dataset.jf)}"]`)?.focus()}});
addEventListener("beforeunload",e=>{if(Object.keys(timers).length){flush();e.preventDefault()}});
/* original lightbox */
$("#lbx").onclick=()=>$("#lb").hidden=true;
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")$("#lb").hidden=true});

/* live prototypes: each embed reports its prototype area; draw at 1440px wide, scaled to fit */
const VW=1440;
const MAXS=1.5;
function fit(fr){
  const vp=fr.closest(".vp"),live=fr.closest(".live");if(!vp||!live)return;
  // frame size: 1440 wide, at least 900 tall; grow only when the design truly overflows it
  const l=+fr.dataset.x||0,t=+fr.dataset.y||0,r=+fr.dataset.w||VW,b=+fr.dataset.h||900;
  // Grow the frame to fit the design. focus.js measures content, not the frame, so growth normally settles at once;
  // as a safety net, more than 40 growths in 3 seconds (a runaway loop) pauses growth, then retries once things settle.
  const pw=+fr.dataset.fw||VW,ph=+fr.dataset.fh||900,now=Date.now(),recent=(fr._grows||[]).filter(t=>now-t<3000);
  let FW=pw,FH=ph;
  if(r>pw||b>ph){if(recent.length<40){FW=Math.max(pw,r);FH=Math.max(ph,b);recent.push(now)}else{clearTimeout(fr._retry);fr._retry=setTimeout(()=>fit(fr),3100)}}
  fr._grows=recent;fr.dataset.fw=FW;fr.dataset.fh=FH;
  // the design's box plus a small margin, kept inside the frame
  const x=Math.max(0,l-16),y=Math.max(0,t-16),cw=Math.max(1,Math.min(FW,r+16)-x),ch=Math.max(1,Math.min(FH,b+16)-y);
  const cs=getComputedStyle(live),W=live.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=live.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const sw=Math.min(1,W/cw),sf=Math.min(MAXS,W/cw,H/ch),one=live.querySelectorAll(".vp").length===1;
  const s=one&&sf>=sw*.6?sf:sw;            // show the whole design when that keeps it large (up to 1.5x); otherwise fill the width at up to 1x and scroll
  fr.style.width=FW+"px";fr.style.height=FH+"px";fr.style.transform=`translate(${-x*s}px,${-y*s}px) scale(${s})`;
  const z=fr.parentElement;z.style.width=Math.floor(cw*s)+"px";z.style.height=Math.floor(ch*s)+"px"}
addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="focus-size")return;
  document.querySelectorAll(".sizer iframe").forEach(fr=>{if(fr.contentWindow===e.source){fr.dataset.x=d.x||0;fr.dataset.y=d.y||0;fr.dataset.w=d.w;fr.dataset.h=d.h;fit(fr)}})});
addEventListener("resize",()=>{setHeaderVar();document.querySelectorAll(".sizer iframe").forEach(fit)});
function openFull(id,i){const o=DATA[prod].options.find(x=>x.id===id);closeFull();
  const el=document.createElement("div");el.className="full";el.id="full";el.setAttribute("role","dialog");el.setAttribute("aria-label","Option "+o.label+" full screen");
  el.innerHTML=`<div class="fbar"><b>${o.label}</b>${o.live.length>1?o.live.map((_,j)=>`<button class="tb" data-fp="${j}" aria-pressed="${j===i}">Screen ${j+1}</button>`).join(""):""}<button class="tb" id="fclose">Close</button></div><iframe src="${o.live[i]}" title="Option ${o.label} prototype, full screen"></iframe>`;
  document.body.append(el);document.body.style.overflow="hidden";
  el.querySelector("#fclose").onclick=closeFull;el.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>openFull(id,+b.dataset.fp));el.querySelector("#fclose").focus()}
function closeFull(){const el=$("#full");if(el){el.remove();document.body.style.overflow=""}}
/* clicks inside a design frame never reach this page; the window losing focus means one happened */
addEventListener("blur",()=>{if(ddOpen){ddOpen=false;renderFilter()}});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(ddOpen){ddOpen=false;renderFilter();$("[data-dd]")?.focus();return}closeFull();$("#lb").hidden=true});

addEventListener("hashchange",()=>{const p=location.hash.slice(1);if((p==="alta"||p==="canopy")&&me){prod=p;render();toTop()}});
if("scrollRestoration" in history)history.scrollRestoration="manual";

/* ---------- boot ---------- */
(async()=>{
  try{me=await api("/api/me");await enter()}
  catch(err){showGate(err.status===401?"":err.status===404||err.status===405||err.status===501?"Saving needs the board’s server. Start it with npm start and open http://localhost:8000.":err.message)}
})();
</script>
